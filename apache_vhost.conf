<VirtualHost *:80>
    ServerName nurahub-finance.vbuddy.in

    ProxyPreserveHost On
    ProxyRequests Off

    # Backend
    ProxyPass        /api http://127.0.0.1:8257/api
    ProxyPassReverse /api http://127.0.0.1:8257/api

    # Frontend
    ProxyPass        / http://127.0.0.1:3124/
    ProxyPassReverse / http://127.0.0.1:3124/

    Header always set X-Robots-Tag "noindex, nofollow, noarchive, nosnippet"

    ErrorLog  ${APACHE_LOG_DIR}/nurahub_finance_error.log
    CustomLog ${APACHE_LOG_DIR}/nurahub_finance_access.log combined
</VirtualHost>
